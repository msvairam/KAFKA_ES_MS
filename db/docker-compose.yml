version: "3.1"

services:
  postgres: 
    image: "postgres:16-alpine"
    container_name: kafka-es-ms-postgres
    ports:
      - "5432:5432"
    deploy:
      mode: "replicated"
      replicas: 1
    environment:
      POSTGRES_USER: catalog_db
      POSTGRES_PASSWORD: catalog_db_password
      POSTGRES_DB: catalog_service
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: